<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Sistema de Intranet Oficial de la Institución Educativa Privadía 'El Educador' (S.J.L. - UGEL 05) - '21 años dejando huellas'.">

  <title>I.E.P. "El Educador" - Intranet Institucional</title>

  

  <!-- Tipografía Google Fonts de Alta Definición: Outfit (Títulos) & Plus Jakarta Sans (Lectura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">



  <!-- Librería Oficial de Lectura de Códigos QR por Cámara (Html5Qrcode + jsQR embebido) -->
  <script src="js/jsqr.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>



  <style>

    /* Protección inmediata anti-desborde de SVGs */

    svg { max-width: 100%; height: auto; }

    .nav-icon { width: 20px !important; height: 20px !important; flex-shrink: 0; }

  </style>



  <!-- Estilos del Sistema Empaquetados (Autocontenidos) -->

  <link rel="stylesheet" href="bundle.css?v=2026.9">

  <link rel="icon" type="image/png" href="logo.png">

</head>

<body>
  <!-- Contenedor de Pantalla de Login -->
  <div id="login-screen-root"></div>

  <!-- Contenedor Principal de la Intranet -->
  <div class="app-container" id="app-container">

    

    <!-- Barra Lateral de Navegación (Sidebar enzul N oche) -->

    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">

        <img src="logo.png" alt="Escudo I.E.P. El Educador S.J.L." class="school-logo" onerror="this.src='assets/logo.png'">

        <div class="school-branding">

          <span class="school-title">I. E. P.</span>

          <span class="school-name">El Educador</span>

          <span style="font-size: 10px; color: var(--color-yellow-400); font-weight: 800; display: block; margin-top: 2px;">

            21 años dejando huellas

          </span>

        </div>

      </div>



      <nav class="sidebar-nav" id="sidebar-nav"></nav>



      <div class="sidebar-footer">

        <div class="academic-year-card">

          <span>Periodo Lectivo:</span>

          <strong style="color: var(--color-yellow-400);">2026 • UGEL 05</strong>

        </div>

      </div>

    </aside>



    <!-- Wrapper de Contenido y Encabezado -->

    <div class="main-wrapper">

      

      <!-- Barra Superior (Top Header) -->

      <header class="top-header">

        <div class="header-left">

          <button class="sidebar-toggle-btn" id="sidebar-toggle" aria-label="Abrir Menú">

            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>

          </button>

          

          <div class="search-container">

            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

            <input type="text" id="global-search" class="search-input" placeholder="Buscar alumnos, expedientes UGEL, notas...">

          </div>

        </div>



        <div class="header-right">

          <!-- Indicador y Botón de Sincronización en la N ube -->

          <button class="btn btn-outline btn-sm" onclick="window.appStore.fetchServerState(false); window.app.showToast('✓ Sincronizado enTiempo Real con la N ube Central', 'success');" style="color: #047857; border-color: #86efac; background: #f0fdf4; font-weight: 800; display: flex; align-items: center; gap: 6px; border-radius: 18px; padding: 6px 12px;" title="Sincronizar ahora contodos los celulares y computadoras">

            <span class="status-dot-green"></span>

            <span style="font-size: 11.5px;">N ube Activa</span>

          </button>



          <!-- Botón de Conexión Móvil QR (Multi-Dispositivo) -->

          <button class="btn btn-outline btn-sm" onclick="window.app.openMultiDeviceConnectModal()" style="color: #1e3a8a; border-color: #93c5fd; background: #eff6ff; font-weight: 800; display: flex; align-items: center; gap: 6px; border-radius: 18px; padding: 6px 12px;" title="Conectar Celular / Escanear desde Móvil">

            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>

            <span style="font-size: 11.5px;">Conectar Celular</span>

          </button>



          <!-- Campana de N otificaciones -->

          <button class="notification-btn" aria-label="N otificaciones" onclick="window.app.navigate('comunicados')">

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>

            <span class="notif-badge">1</span>

          </button>



          <!-- Perfil de Usuario Activo (Foto de Perfil) -->

          <div class="user-profile-chip" onclick="window.app.navigate('díashboard')" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">

            <div class="user-avatar-badge" id="header-user-avatar" style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #1e3a8a 0%, #0b132b 100%); color: #fde047; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; border: 1.5px solid #fde047; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">

              👤

            </div>

            <div class="user-info">

              <span class="user-name" id="header-user-name" style="font-weight: 800; font-size: 13px; color: var(--color-navy-900);">Prof. Alex Lino</span>

              <span class="user-role-tag" id="header-user-role" style="font-size: 11px; color: var(--text-muted); display: block;">Coordinación & Documentación</span>

            </div>

          </div>



          <!-- Botón Cambiar Contraseña -->

          <button class="btn btn-outline btn-sm" onclick="window.app.openChangePasswordModal()" style="color: #0f172a; border-color: #cbd5e1; background: #f8fafc; font-weight: 800; display: flex; align-items: center; gap: 4px;" title="Cambiar mi contraseña">

            <span>🔑</span>

            <span style="font-size: 11.5px;">Clave</span>

          </button>



          <!-- Botón de Cerrar Sesión  -->

          <button class="btn btn-outline btn-sm" onclick="window.app.handleLogout()" style="color: var(--color-red-600); border-color: var(--color-red-200); display: flex; align-items: center; gap: 4px;" title="Cerrar Sesión ">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>

            <span>Salir</span>

          </button>

        </div>

      </header>



      <!-- Área de Contenido Principal Dinmico -->

      <main id="content-aÁrea" class="content-aÁrea">

        <!-- Renderizado dinámicamente por JavaScript -->

      </main>



    </div>



  </div>



  <!-- Modal Global Overlay -->

  <div class="modal-overlay" id="app-modal-overlay"></div>



  <!-- Contenedor de Alertas Toast -->

  <div class="toast-container" id="toast-container"></div>



  <!-- Scripts de la Aplicación (Bundle Todo-en-Uno Autocontenido) -->

  <script src="bundle.js?v=2026.9"></script>

  <script>

    if (window.app && typeof window.app.render === "function") {

      window.app.render();

    }

  </script>

</body>

</html>
